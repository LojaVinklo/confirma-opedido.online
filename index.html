
<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>Resumo do Pedido - Vinklo</title>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<style>
    /* estilo omitido aqui para economia */
  </style>
</head>
<body>
<div class="header">
<div class="logo-container">
<img alt="Logo Vinklo" src="Design_sem_nome-removebg-preview.png"/>
<span>Vinklo</span>
</div>
<strong>Caixa</strong>
</div>
<div class="progress-bar">
<span>1. Endereço</span>
<span style="background:#6a1b9a;">2. Confirmação</span>
<span style="background:#d1a3e6;">3. Pagamento</span>
</div>
<div class="container">
<h2>Resumo do Pedido</h2>
<div class="section">
<p class="label">Produto:</p>
<div class="produto">
<img alt="Panela Philco" src="panela.jpg"/>
<div>
<p>Panela de Pressão Elétrica Philco 6L Digital</p>
<p id="voltagem">Voltagem: <span id="voltagem-exibida">Carregando...</span></p>
<p>Cor: Preto</p>
<p class="preco">Preço: R$189,90</p>
<div class="metodo-pagamento">
<p class="label">Método de pagamento:</p>
<div class="opcoes">
<label><input checked="" name="pagamento" type="radio"/><img alt="Google" src="play_store-removebg-preview.png"/><div class="aprovacao">⚠️ Aprovação imediata</div></label>
<label><input name="pagamento" type="radio"/><img alt="Pix" src="pix.PNG"/></label>
</div>
</div>
</div>
</div>
</div>
<div class="center">
<button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
<div class="loader" id="loader"></div>
</div>
</div>
<script>
    function finalizarCompra() {
      document.getElementById('loader').style.display = 'block';
      setTimeout(() => {
        window.open('https://lojavinklo.github.io/pay.pagamentosrapidoseguro.online/', '_blank');
        document.getElementById('loader').style.display = 'none';
      }, 2000);
    }
  </script><script>
  document.addEventListener('DOMContentLoaded', () => {
    const voltagem = localStorage.getItem('voltagemSelecionada');
    if (voltagem) {
      document.getElementById('voltagem-exibida').textContent = voltagem;
    } else {
      document.getElementById('voltagem-exibida').textContent = 'Não selecionada';
    }
  });
</script>
</body>
</html>
